            --bs-btn-bg: var(--color-primary);
            --bs-btn-border-color: var(--color-primary);

            --bs-btn-hover-bg: var(--color-primary-darker);
            --bs-btn-hover-border-color: var(--color-primary-darker);

            --bs-btn-hover-color: hsl(var(--primary-foreground));
            --bs-btn-hover-bg: var(--color-primary);
            --bs-btn-hover-border-color: var(--color-primary);

            --bs-btn-active-bg: var(--color-primary);
            --bs-btn-active-border-color: var(--color-primary-darker);
            --bs-btn-disabled-color: var(--color-primary);
            --bs-btn-disabled-bg: transparent;
            --bs-btn-disabled-border-color: var(--color-primary);
        }

        .btn-primary-light {

            --bs-btn-hover-border-color: hsl(var(--secondary));

            --bs-btn-active-border-color: var(--color-primary-darker);
            --bs-btn-disabled-bg: hsl(var(--secondary));
            --bs-btn-disabled-border-color: hsl(var(--secondary));
