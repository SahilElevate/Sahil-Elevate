<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Free Educations | Login Page</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="sahil-elevate.jpg">
</head>

<body data-on="false">

    <div class="container">

        <div class="lamp-wrapper">

            <svg class="lamp-svg" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">

                <ellipse class="inner-glow" cx="100" cy="110" rx="60" ry="30" />

                <rect class="lamp-base" x="92" y="100" width="16" height="160" rx="8" />

                <rect class="lamp-base" x="60" y="250" width="80" height="12" rx="6" />

                <g class="pull-cord">

                    <line class="cord-line" x1="130" y1="110" x2="130" y2="180" />

                    <circle class="cord-bead" cx="130" cy="190" r="6" />

                    <circle class="cord-hit" cx="130" cy="190" r="25" fill="transparent" />

                </g>

                <path class="lamp-shade" d="M30 110 C 30 50, 170 50, 170 110 C 170 125, 30 125, 30 110 Z" />

            </svg>

        </div>


        <div class="login-form">

            <h2>Welcome</h2>

            <form id="loginForm">

                <div class="form-group">

                    <label>Username</label>

                    <input id="username" type="text" placeholder="Enter name" required>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input id="password" type="password" placeholder="Enter Password" required>

                </div>


                <button type="submit" class="login-btn">

                    Sign In

                </button>

            </form>

        </div>

    </div>


    <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>

    <script src="https://unpkg.com/gsap@3/dist/Draggable.min.js"></script>

    <script src="script.js"></script>


    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value.trim();


                // Username aur password check
                if (username !== "" && password !== "") {

                    // Login successful
                    localStorage.setItem("isLoggedIn", "true");

                    localStorage.setItem(
                        "username",
                        username
                    );


                    // Home page par redirect
                    window.location.href = "home.html";

                } else {

                    alert("Please enter username and password.");

                }

            });

    </script>




</body>

</html>
